{% extends "base.html" %}
{% block title%}Url Shortener Page{% endblock %}

{% block content%}
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p>{{message}}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}
<form action="#" method="post">
    <p>Enter Url:</p>
    <p><input type="text" name="url" placeholder="Paste your URL here"/></p> 
    <p><input type="submit" value="submit"/></p>
</form>
{% endblock %}
